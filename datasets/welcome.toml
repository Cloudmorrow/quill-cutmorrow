# The note everybody finds in the Vidmorrow folder of their drive: what the
# folder is for. Seeding it is what makes the folder.
[[records]]
share = "my-files"
path = "Vidmorrow/How Vidmorrow works.md"
text = """
# Vidmorrow

Put the videos you want to edit in this folder: from the Files Quill, the
desktop app's mount, or WebDAV. Then open Vidmorrow:

1. **Edit this video** makes a clip of it.
2. **Add a blur**: what it hides, from when, and where the box is, in percent
   of the frame.
3. **Add a keyframe** at a later moment with the box where it is then. In
   between, the box moves and resizes in a straight line.
4. **Export.** The result lands here, beside the original, as
   `<name> blurred.mp4`.

The pictures of your keyframes are kept in the Previews folder here.
"""
