# Vidmorrow: a video editor. The videos and sounds in My Files › Videos are
# its material; a project lays pieces of them on video and audio tracks, cut,
# trimmed and moved, with blurs that follow keyframes and a crop, and exports
# a new file beside the originals. The editor is Cloudmorrow's timeline kit,
# drawn on every surface; the pictures and the export come from a service
# beside the server, with ffmpeg, which the install brings. See CLAUDE.md for
# the format and the loop.

[quill]
id = "vidmorrow"
name = "Vidmorrow"
version = "2.0.0"
summary = "A video editor for the videos in your drive: cut, trim and arrange clips on video and audio tracks, blur what should not be seen, crop, and export."
category = "personal"
icon = "play"
publisher = "Cloudmorrow"
license = "AGPL-3.0-or-later"
code = "quill.py"
features = [
  "Every video and sound in My Files › Videos, subfolders too, is material: one press starts a project from it",
  "A real timeline: video and audio tracks, pieces cut, trimmed, split, moved and rearranged; a higher video track covers a lower one",
  "Sound from every piece, mixed: mute one, or set its volume",
  "Blur a face, a number plate or a screen with keyframes: the box moves and resizes in a straight line between them, and moves with its piece",
  "Crop the whole picture",
  "Export to MP4, WebM, MOV, GIF or sound-only M4A, as the project or at 1080p, 720p or 480p; the file lands beside the originals",
  "The same editor on the web and the phone (live, with sound), in the terminal (real frames) and on the command line",
]

# The material and the exports are files in the person's drive.
[uses]
datamodels = ["file"]

# -- screens -------------------------------------------------------------------------
# Every video and sound in My Files › Videos, with a button to start editing.
[[screens]]
id = "clips"
label = "Clips"
view = "clips"
model = "vidmorrow.project"

# The editor: Cloudmorrow's timeline kit (docs/TIMELINE.md in the core).
[[screens]]
id = "editor"
kit = "timeline"
label = "Editor"
model = "vidmorrow.project"
title = "name"
pieces = "vidmorrow.piece"
effects = "vidmorrow.effect"
media = { share = "my-files", within = "Videos" }
frames = "frames"
export = "export"

# -- actions -------------------------------------------------------------------------
# A video (or a sound) becomes a project with it on the first track.
[[actions]]
id = "edit-video"
label = "Edit this video"
on = "file"
tone = "primary"
description = "Starts a project from this video or sound: all of it, on the first track of its kind."
[actions.fields]
name = { kind = "string", description = "What to call the project; the file's name when left out" }

# The export: rendered beside the server, and put beside the first piece's
# video in My Files. The project says how it goes.
[[actions]]
id = "export"
label = "Export"
on = "vidmorrow.project"
tone = "primary"
description = "Renders the project to a new file beside its first video in My Files › Videos."
[actions.fields]
format = { kind = "enum", values = ["mp4", "webm", "mov", "gif", "m4a"], labels = ["MP4 (H.264, AAC)", "WebM (VP9, Opus)", "MOV (H.264)", "GIF (no sound)", "M4A (sound only)"], default = "mp4", required = true }
size = { kind = "enum", values = ["project", "1080p", "720p", "480p"], labels = ["As the project", "1080p", "720p", "480p"], default = "project", required = true }
name = { kind = "string", description = "What to call the file; the project's name when left out" }

# Draw the screen again: the renderer works beside the server.
[[actions]]
id = "refresh"
label = "Refresh"
assistant = false

# -- the renderer ----------------------------------------------------------------------
# A program beside the server, with ffmpeg: it answers the frames API the
# editor draws its viewer from, fills in the lengths and sizes the kit
# leaves blank, and renders the exports people ask for. It works through the
# record API, as the administrator who installed Vidmorrow.
[[services]]
id = "render"
command = ["python", "services/render.py"]
always = true

# The frames API: /api/q/vidmorrow/frames/info, /source and /frame.
[[apis]]
id = "frames"
service = "render"
prefix = "frames"

# ffmpeg and ffprobe come with the install: the server fetches the catalog's
# static build for its own machine, checks it, and puts it first on the
# renderer's PATH. Nobody installs anything on the server by hand.
[requires]
runtimes = ["ffmpeg"]
