# Where an effect's box is at one moment. The box is in percent of the
# frame, so a keyframe reads the same whatever the video's size.

[datamodel]
id = "vidmorrow.keyframe"
version = 1
label = "Keyframe"
description = "Where an effect's box is at one moment of the clip; between two keyframes it moves and resizes in a straight line."
scopes = ["personal"]
title = "at"

[fields]
clip = { kind = "link", to = "vidmorrow.clip", required = true, indexed = true, on_delete = "cascade" }
effect = { kind = "link", to = "vidmorrow.effect", required = true, indexed = true, on_delete = "cascade" }
at = { kind = "decimal", required = true, indexed = true, label = "At (seconds)", description = "Seconds from the start of the clip" }
x = { kind = "decimal", required = true, label = "Left (%)", description = "The box's left edge, in percent of the frame's width" }
y = { kind = "decimal", required = true, label = "Top (%)", description = "The box's top edge, in percent of the frame's height" }
w = { kind = "decimal", required = true, label = "Width (%)" }
h = { kind = "decimal", required = true, label = "Height (%)" }
preview = { kind = "string", description = "A picture of this frame with the box drawn on it, made by the renderer" }
preview_of = { kind = "string", description = "What the picture shows, so a changed keyframe gets a new one" }
