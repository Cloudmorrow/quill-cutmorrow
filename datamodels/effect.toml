# Something done to a piece over time: for now, a blur. Its keyframes say
# where the box is at moments of the piece; in between it moves and resizes
# in a straight line.

[datamodel]
id = "cutmorrow.effect"
version = 2
label = "Effect"
description = "A blur over part of a piece: what it hides, how strongly, and where its box is at moments of the piece."
scopes = ["personal"]
title = "label"

[fields]
piece = { kind = "link", to = "cutmorrow.piece", required = true, indexed = true, on_delete = "cascade" }
kind = { kind = "enum", values = ["blur"], labels = ["Blur"], default = "blur", indexed = true }
label = { kind = "string", required = true, description = "What it hides: a face, a number plate, a screen" }
strength = { kind = "int", default = 20, description = "How much it blurs, 1 to 100" }
keyframes = { kind = "json", default = [], description = "[{t, x, y, w, h}]: t in seconds from the piece's start, the box in percent of the frame" }
