# What the renderer read from a file in the drive with ffprobe, so a new
# project's piece starts with its length. Written by the renderer only; a
# changed file is read again. A photo has a size and no length.

[datamodel]
id = "cutmorrow.media"
version = 1
label = "Media"
description = "What a video, photo or sound in the drive is: its length, picture size, frame rate, and whether it has a picture, sound, or is a still photo."
scopes = ["personal"]
title = "name"

[fields]
source = { kind = "string", required = true, indexed = true, label = "File" }
name = { kind = "string", required = true }
modified = { kind = "string", description = "The file's modified time when it was read" }
duration = { kind = "decimal", label = "Length (seconds)" }
width = { kind = "int" }
height = { kind = "int" }
fps = { kind = "decimal", label = "Frames per second" }
video = { kind = "bool", default = false, label = "Has a picture" }
audio = { kind = "bool", default = false, label = "Has sound" }
image = { kind = "bool", default = false, label = "Is a photo", description = "One still picture, with no length of its own" }
